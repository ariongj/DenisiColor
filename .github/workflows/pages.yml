# Build the demo for GitHub Pages under https://<user>.github.io/DenisiColor/ and publish it to the gh-pages branch
# (Pages serves that branch). Root deployments (Vercel / Netlify) keep using vercel.json and public/_redirects with "/".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (base /DenisiColor/)
        run: npm run build
        env:
          BASE_PATH: /DenisiColor/

      # SPA fallback: GitHub Pages serves 404.html for deep links such as /DenisiColor/admin/porosite,
      # so it must be the app shell. .nojekyll keeps files that start with "_" in the site.
      - name: SPA fallback
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publish to gh-pages
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
